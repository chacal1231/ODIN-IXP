daemonize: false
bmp_daemon_ip: 0.0.0.0
bmp_daemon_port: 5000
bmp_daemon_max_peers: 20

! Solo eventos en tiempo real (cambios de ruta, peer up/down)
bmp_daemon_msglog_file: /data/bmp-logs/bmp-events-$peer_src_ip.json

! Recomendado: timestamps en UTC. Sin esta opción pmbmpd escribe hora local y ClickHouse la
! interpreta con la zona del servidor. Activarla cambia el significado de las filas nuevas
! respecto a las existentes: coordinar antes de habilitar.
! timestamps_utc: true
